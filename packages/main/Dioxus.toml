[web.wasm.opt]
debug = false
level = "z"

# [web.app]
# base_path = "/"

[application]
name = "NixOs Desktop"
default_platform = "web"

[web.watcher]
watch_path = ["src", "assets"]
reload_html = true

[web.resource]
style = [
  "/assets/globals.css",
  "/assets/styleguide.css",
  "/assets/booting.css",
  "/assets/login.css",
]

[web.resource.dev]
