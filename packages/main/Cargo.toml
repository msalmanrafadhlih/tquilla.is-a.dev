[package]
name = "main"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = [] }
wasm-bindgen = { workspace = true }
ui = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window"] }

[features]
default = ["web"]
web = ["dioxus/web"]

