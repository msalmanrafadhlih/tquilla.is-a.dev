name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # biar bisa di-trigger manual dari tab Actions

permissions:
  contents: read
  pages: write # dibutuhkan actions/deploy-pages
  id-token: write # dibutuhkan actions/deploy-pages (OIDC)

# cegah dua deployment jalan bersamaan / numpuk di antrian
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # format + clippy + test; build di bawah baru jalan kalau ini hijau.
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust + target wasm32
        # versi sama dengan rust-toolchain.toml dan ci.yml
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        # Dipin ke tag rilis (bukan branch `main`), supaya CI tidak ikut berubah
        # saat ada commit baru di repo action itu. Naikkan versinya sengaja.
        uses: cargo-bins/cargo-binstall@v1.25.2

      - name: Install dioxus-cli (dx)
        # pin versi biar SAMA PERSIS dengan versi crate `dioxus` yang terkunci di
        # Cargo.lock (0.7.10; Cargo.toml hanya meminta ^0.7.1). Versi dx yang beda
        # dari versi crate bisa bikin wasm-opt/binaryen bundled-nya mismatch.
        # Kalau `cargo update` menaikkan dioxus, naikkan angka ini juga.
        run: cargo binstall dioxus-cli@0.7.10 --force -y

      - name: Build Tailwind CSS
        # `asset!("/assets/tailwind.css")` butuh file-nya ada saat compile,
        # jadi di CI kita generate dulu secara eksplisit (dx juga akan
        # menimpanya). Pakai standalone CLI v4 (tailwind.css pakai sintaks v4),
        # versi di-pin biar build nggak berubah diam-diam saat ada major baru.
        #
        # Checksum: set variable repo `TAILWIND_SHA256` (Settings > Secrets and
        # variables > Actions > Variables) ke hash yang dicetak step ini
        # sekali; setelah itu binary yang berbeda akan menggagalkan build.
        # Selama belum di-set, step ini hanya memberi peringatan + hash-nya.
        env:
          TAILWIND_SHA256: ${{ vars.TAILWIND_SHA256 }}
        run: |
          curl -fsSLO https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.11/tailwindcss-linux-x64
          actual="$(sha256sum tailwindcss-linux-x64 | cut -d' ' -f1)"
          if [ -n "$TAILWIND_SHA256" ]; then
            if [ "$actual" != "$TAILWIND_SHA256" ]; then
              echo "::error::Checksum Tailwind tidak cocok. Diharapkan $TAILWIND_SHA256, didapat $actual"
              exit 1
            fi
          else
            echo "::warning::TAILWIND_SHA256 belum di-set. Hash binary ini: $actual"
          fi
          chmod +x tailwindcss-linux-x64
          ./tailwindcss-linux-x64 \
            -i ./packages/web/tailwind.css \
            -o ./packages/web/assets/tailwind.css \
            --minify

      - name: Build & bundle (release, web)
        # dx bundle, bukan dx build — dx build cuma wrapper `cargo build`,
        # sedangkan dx bundle yang menjalankan pipeline produksi Dioxus
        # (kompresi wasm, minifikasi, dst).
        run: dx bundle --package web --platform web --release

      - name: Suntik metadata statis (lang, OG tags, robots, sitemap, noscript)
        # Crawler preview link (WhatsApp/Discord/Facebook) tidak menjalankan
        # WASM, jadi meta tag harus ada di HTML statis. Harus jalan SEBELUM
        # langkah 404.html di bawah, supaya salinannya ikut berisi tag ini.
        run: python3 scripts/postbuild.py target/dx/web/release/web/public

      - name: Tambahkan CNAME untuk custom domain
        # tanpa file ini, custom domain "tquilla.is-a.dev" yang kamu set di
        # Settings > Pages bisa ke-reset tiap kali deployment mengganti isi output
        run: echo "tquilla.is-a.dev" > target/dx/web/release/web/public/CNAME

      - name: Tambahkan 404.html untuk client-side routing
        # GitHub Pages itu static file server: /profile atau /deisktify dicari
        # sebagai path fisik, nggak ketemu, jadi dia serve 404.html bawaan Pages.
        # Router Dioxus butuh index.html dulu ke-load biar JS-nya bisa ambil alih
        # routing. Trik standarnya: bikin 404.html isinya sama persis dengan
        # index.html, jadi GitHub Pages tetap serve app-nya untuk path apapun,
        # lalu Dioxus Router baca window.location dan render route yang benar.
        run: cp target/dx/web/release/web/public/index.html target/dx/web/release/web/public/404.html

      - name: Upload artifact ke Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/dx/web/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
