name: Platforms (desktop + mobile)

# Cek kompilasi `desktop` dan `mobile` di host Linux. Sengaja workflow
# TERPISAH dari ci.yml: ci.yml dipanggil deploy-page.yml (`needs: check`),
# jadi kalau cek ini digabung ke sana, kegagalan desktop/mobile bisa menahan
# deploy web ke production.
#
# Yang dicek: kode Rust-nya compile + lolos clippy. Yang TIDAK dicek: build
# Android sebenarnya (NDK, `dx bundle --platform android`) dan runtime webview.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: cargo check + clippy (desktop, mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versi harus sama dengan rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Library sistem untuk webview (wry/tao)
        # Sama dengan yang disediakan devenv.nix. Tanpa ini `cargo check`
        # gagal di build script `gdk-sys` (gdk-3.0.pc tidak ditemukan).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libssl-dev pkg-config

      - name: Check
        # build.rs di tiap paket membuat assets/tailwind.css kosong kalau belum
        # ada, jadi `asset!()` tidak gagal di checkout bersih.
        run: cargo check -p desktop -p mobile --locked

      - name: Clippy (warning = error)
        run: cargo clippy -p desktop -p mobile --all-targets --locked -- -D warnings
