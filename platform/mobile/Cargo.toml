[package]
name = "mobile"
version.workspace = true
edition.workspace = true

# Nama biner jadi nama aplikasi Android ("NixosMobile") dan nama library .so.
# Nama paket Cargo tetap `mobile` (dipakai `-p mobile` di CI).
[[bin]]
name = "nixos-mobile"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true }
components = { workspace = true }
# Opens links outside the app: Android `Intent.ACTION_VIEW` (JNI) and iOS
# `openURL`. Same crate (and major version) dioxus-desktop already uses for
# link clicks, so no new code ends up in the Cargo.lock beyond this edge.
webbrowser = "1"

[features]
default = ["mobile"]
mobile = ["dioxus/mobile"]
