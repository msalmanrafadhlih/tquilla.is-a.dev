[workspace]
resolver = "2"
members = [
    "packages/components",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde_json = "1"
base64 = "0.23.1"
wasm-bindgen = "=0.2.127"
dioxus = { version = "0.7.1" }
serde = { version = "1", features = ["derive"] }

components = { path = "packages/components" }

# Ukuran .wasm adalah biaya load terbesar di web. Pengaturan ini mengikuti
# panduan "optimizing binary size" Dioxus. Catatan: berlaku juga untuk build
# desktop/mobile; `panic = "abort"` tidak mengubah wasm (wasm32 memang tidak
# punya unwinding), tapi membuang kode unwind di target native.
[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
