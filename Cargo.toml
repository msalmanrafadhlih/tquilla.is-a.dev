[workspace]
resolver = "2"
members = [
    "crates/components",
    "crates/markdown",
    "platform/web",
    "platform/desktop",
    "platform/mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde_json = "1"
wasm-bindgen = "=0.2.127"
dioxus = { version = "0.7.1" }
serde = { version = "1", features = ["derive"] }

# Kontrak API bersama: paket `tquilla-api-types` dari crates.io (sumbernya ada di
# repo backend). Nama library tetap `api_types`, jadi `use api_types::...` tidak
# berubah. Versi dikunci oleh Cargo.lock (dengan checksum crates.io); naikkan
# sengaja. Di 0.x, `0.1` tidak ikut ke `0.2` (minor naik = tidak kompatibel).
api-types = { package = "tquilla-api-types", version = "0.1.0" }

# Parser Markdown untuk entri Guestbook, dipakai oleh crate `markdown`.
# `default-features = false` membuang renderer HTML dan `getopts` (CLI): kita
# tidak pernah membuat string HTML, peristiwa parser langsung jadi pohon
# (`crates/markdown`) lalu elemen Dioxus (`crates/components`).
pulldown-cmark = { version = "0.13", default-features = false }

components = { path = "crates/components" }
markdown = { path = "crates/markdown" }

# Ukuran .wasm adalah biaya load terbesar di web. Pengaturan ini mengikuti
# panduan "optimizing binary size" Dioxus. Catatan: berlaku juga untuk build
# desktop/mobile; `panic = "abort"` tidak mengubah wasm (wasm32 memang tidak
# punya unwinding), tapi membuang kode unwind di target native.
[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
